<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --ink: #1a2230;
    --muted: #5b6678;
    --line: #d5dbe4;
    --accent: #2f5bea;
    --font: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.7 var(--font); }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  header.intro { padding: 56px 0 32px; }
  header.intro h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); font-weight: 600; line-height: 1.2; }
  header.intro .tagline { margin: 0 0 16px; font-size: 1.15rem; color: var(--muted); }
  header.intro .about { max-width: 62ch; margin: 0 0 16px; }
  .links { display: flex; gap: 16px; flex-wrap: wrap; padding: 0; margin: 0; list-style: none; }

  h2 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
  .hint { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }

  /* 그래프 영역: 이 페이지에서 가장 눈에 띄는 부분 */
  .graph-section { padding: 24px 0 48px; }
  .graph-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
  #cy { height: 620px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 0; padding: 0; list-style: none; font-size: .9rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

  .filter { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; }
  .filter summary { cursor: pointer; font-weight: 500; }
  .filter-actions { display: flex; gap: 8px; margin: 12px 0 4px; }
  .filter-actions .chip { width: auto; }
  .filter fieldset { border: 0; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .filter legend { padding: 0; margin: 0 0 4px; font-size: .9rem; font-weight: 500; }
  .filter label { font-size: .95rem; cursor: pointer; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; height: 620px; overflow-y: auto; }
  .panel h3 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 600; }
  .panel .group { margin: 0 0 12px; font-size: .9rem; font-weight: 500; }
  .panel img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 6px; margin: 0 0 12px; }
  .panel .desc { margin: 0 0 16px; white-space: pre-line; }
  .panel h4 { margin: 16px 0 8px; font-size: .95rem; font-weight: 600; }
  .chips { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
  .chip { width: 100%; text-align: left; font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip small { color: var(--muted); margin-left: 6px; }

  .projects { padding: 16px 0 72px; }
  .project-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 0; margin: 16px 0 0; list-style: none; }
  .project { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .project h3 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 600; }
  .project .meta { margin: 0 0 8px; color: var(--muted); font-size: .9rem; }
  .project p { margin: 0 0 8px; }

  @media (max-width: 860px) {
    .graph-grid { grid-template-columns: 1fr; }
    #cy { height: 480px; }
    .panel { height: auto; max-height: none; }
  }
</style>
</head>
<body>

<header class="intro">
  <div class="wrap">
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="about" id="about"></p>
    <ul class="links" id="links"></ul>
  </div>
</header>

<main>
  <section class="graph-section" aria-labelledby="graph-title">
    <div class="wrap">
      <h2 id="graph-title">연구 개념 지도</h2>
      <p class="hint">큰 노드는 핵심 개념이에요. 작은 노드는 아래에서 켜고, 화면을 확대하면 이름이 보여요. 노드를 선택하면 설명이 오른쪽에 표시돼요.</p>
      <div class="graph-grid">
        <div>
          <details class="filter" open>
            <summary>관심 개념 켜고 끄기</summary>
            <div class="filter-actions">
              <button type="button" class="chip" id="all-on">모두 켜기</button>
              <button type="button" class="chip" id="all-off">모두 끄기</button>
            </div>
            <div id="filter-groups"></div>
          </details>
          <div id="cy" role="img" aria-label="연구 개념 네트워크 그래프. 오른쪽 패널의 목록으로도 탐색할 수 있어요."></div>
          <ul class="legend" id="legend"></ul>
        </div>
        <aside class="panel" id="panel" aria-live="polite"></aside>
      </div>
    </div>
  </section>

  <section class="projects" aria-labelledby="projects-title">
    <div class="wrap">
      <h2 id="projects-title">프로젝트</h2>
      <ul class="project-list" id="projects"></ul>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="data.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 소개 / 프로젝트 ----------
  $("name").textContent = SITE.name;
  $("tagline").textContent = SITE.tagline;
  $("about").textContent = SITE.about;
  document.title = SITE.name + "의 포트폴리오";

  SITE.links.forEach(function (l) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = l.url; a.textContent = l.label;
    if (l.url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
    li.appendChild(a); $("links").appendChild(li);
  });

  PROJECTS.forEach(function (p) {
    var li = document.createElement("li"); li.className = "project";
    var h = document.createElement("h3"); h.textContent = p.title;
    var m = document.createElement("p"); m.className = "meta"; m.textContent = p.period + " · " + p.role;
    var s = document.createElement("p"); s.textContent = p.summary;
    li.append(h, m, s);
    if (p.link) {
      var a = document.createElement("a");
      a.href = p.link; a.textContent = "자세히 보기"; a.target = "_blank"; a.rel = "noopener";
      li.appendChild(a);
    }
    $("projects").appendChild(li);
  });

  // ---------- 그래프 ----------
  var LABEL_ZOOM = 1.0; // 관심 노드 이름이 보이기 시작하는 확대 배율 (클수록 더 확대해야 보여요)
  var selectedId = null;
  var boxes = {};
  var nodeById = {};
  var degree = {};
  GRAPH.nodes.forEach(function (n) { nodeById[n.id] = n; degree[n.id] = 0; });
  GRAPH.edges.forEach(function (e) { degree[e.source]++; degree[e.target]++; });

  var elements = GRAPH.nodes.map(function (n) {
    var interest = n.tier === "interest";
    return {
      data: { id: n.id, label: n.label, color: GRAPH.groups[n.group] || "#888",
              size: interest ? 14 + degree[n.id] * 3 : 34 + degree[n.id] * 7 },
      classes: interest ? "interest" : "core"
    };
  }).concat(GRAPH.edges.map(function (e, i) {
    return { data: { id: "e" + i, source: e.source, target: e.target, label: e.label || "" } };
  }));

  var cy = cytoscape({
    container: $("cy"),
    elements: elements,
    minZoom: 0.4, maxZoom: 2.5,
    style: [
      { selector: "node", style: {
          "background-color": "data(color)", "width": "data(size)", "height": "data(size)",
          "label": "data(label)", "font-family": "IBM Plex Sans KR, sans-serif", "font-size": 13,
          "color": "#1a2230", "text-valign": "bottom", "text-margin-y": 6,
          "text-wrap": "wrap", "text-max-width": 90 } },
      { selector: "node.interest", style: { "font-size": 11, "min-zoomed-font-size": 11 * LABEL_ZOOM, "text-margin-y": 4 } },
      { selector: ".off", style: { "display": "none" } },
      { selector: "edge", style: { "width": 1.5, "line-color": "#b8c1cf", "curve-style": "bezier" } },
      { selector: "edge.hl", style: {
          "line-color": "#2f5bea", "width": 2.5, "label": "data(label)", "font-size": 10,
          "font-family": "IBM Plex Sans KR, sans-serif", "color": "#5b6678",
          "text-background-color": "#ffffff", "text-background-opacity": 1, "text-background-padding": 2,
          "text-rotation": "autorotate" } },
      { selector: ".faded", style: { "opacity": 0.18 } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#1a2230" } }
    ],
    layout: { name: "cose", animate: false, padding: 40, randomize: true, nodeRepulsion: 12000, idealEdgeLength: 100, nodeOverlap: 40, nodeDimensionsIncludeLabels: true }
  });

  // 겹침 제거: 노드 크기와 여백 기준으로 겹치는 쌍을 서로 밀어내요 (숨겨진 노드 자리까지 미리 확보)
  (function separate() {
    var nodes = cy.nodes(), GAP = 30;
    for (var k = 0; k < 300; k++) {
      var moved = false;
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j], pa = a.position(), pb = b.position();
          var dx = pb.x - pa.x, dy = pb.y - pa.y, dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          var min = (a.data("size") + b.data("size")) / 2 + GAP;
          if (dist < min) {
            var push = (min - dist) / 2, ux = dx / dist, uy = dy / dist;
            a.position({ x: pa.x - ux * push, y: pa.y - uy * push });
            b.position({ x: pb.x + ux * push, y: pb.y + uy * push });
            moved = true;
          }
        }
      }
      if (!moved) break;
    }
  })();

  // 범례
  Object.keys(GRAPH.groups).forEach(function (g) {
    var li = document.createElement("li");
    var dot = document.createElement("i"); dot.style.background = GRAPH.groups[g];
    li.append(dot, document.createTextNode(g));
    $("legend").appendChild(li);
  });

  // ---------- 관심 개념 켜기/끄기 ----------
  function setVisible(id, on, pan) {
    var n = cy.getElementById(id);
    if (n.empty() || !n.hasClass("interest")) return;
    n.toggleClass("off", !on);
    if (boxes[id]) boxes[id].checked = on;
    if (on && pan) cy.animate({ center: { eles: n }, duration: reduceMotion ? 0 : 300 });
  }

  Object.keys(GRAPH.groups).forEach(function (g) {
    var items = GRAPH.nodes.filter(function (n) { return n.tier === "interest" && n.group === g; });
    if (!items.length) return;
    var fs = document.createElement("fieldset");
    var lg = document.createElement("legend"); lg.textContent = g; fs.appendChild(lg);
    items.forEach(function (n) {
      var lb = document.createElement("label");
      var cb = document.createElement("input"); cb.type = "checkbox";
      cb.addEventListener("change", function () {
        setVisible(n.id, cb.checked, true);
        if (!cb.checked && selectedId === n.id) reset();
      });
      boxes[n.id] = cb;
      lb.append(cb, document.createTextNode(" " + n.label));
      fs.appendChild(lb);
    });
    $("filter-groups").appendChild(fs);
  });

  $("all-on").addEventListener("click", function () {
    Object.keys(boxes).forEach(function (id) { setVisible(id, true); });
  });
  $("all-off").addEventListener("click", function () {
    Object.keys(boxes).forEach(function (id) { setVisible(id, false); });
    if (selectedId && boxes[selectedId]) reset();
  });

  GRAPH.nodes.forEach(function (n) { if (n.tier === "interest") setVisible(n.id, !!n.on); });
  cy.fit(cy.nodes().not(".off"), 40);

  // ---------- 오른쪽 패널 ----------
  var panel = $("panel");

  function chip(label, note, id) {
    var li = document.createElement("li");
    var b = document.createElement("button"); b.type = "button"; b.className = "chip";
    b.textContent = label;
    if (note) { var s = document.createElement("small"); s.textContent = note; b.appendChild(s); }
    b.addEventListener("click", function () { show(id); });
    li.appendChild(b); return li;
  }

  function showAll() {
    panel.textContent = "";
    var h = document.createElement("h3"); h.textContent = "전체 개념";
    var p = document.createElement("p"); p.className = "desc";
    p.textContent = "그래프에서 노드를 선택하거나 아래 목록에서 고르세요.";
    var ul = document.createElement("ul"); ul.className = "chips";
    GRAPH.nodes.forEach(function (n) {
      ul.appendChild(chip(n.label, n.group + (n.tier === "interest" ? ", 관심 개념" : ", 핵심"), n.id));
    });
    panel.append(h, p, ul);
  }

  function show(id) {
    var node = cy.getElementById(id), data = nodeById[id];
    if (node.empty() || !data) return;
    if (node.hasClass("off")) setVisible(id, true);
    selectedId = id;

    cy.elements().removeClass("faded hl");
    cy.elements().unselect();
    node.select();
    cy.elements().not(node.closedNeighborhood()).addClass("faded");
    node.connectedEdges().addClass("hl");
    cy.animate({ center: { eles: node }, duration: reduceMotion ? 0 : 300 });

    panel.textContent = "";
    var h = document.createElement("h3"); h.textContent = data.label;
    var g = document.createElement("p"); g.className = "group"; g.textContent = data.group;
    g.style.color = GRAPH.groups[data.group] || "inherit";
    panel.append(h, g);

    if (data.image) {
      var img = document.createElement("img");
      img.src = data.image; img.alt = data.label;
      img.addEventListener("error", function () { img.remove(); });
      panel.appendChild(img);
    }

    var d = document.createElement("p"); d.className = "desc"; d.textContent = data.description || "";
    panel.appendChild(d);

    var nbrs = node.neighborhood("node");
    if (nbrs.length) {
      var h4 = document.createElement("h4"); h4.textContent = "연결된 개념";
      var ul = document.createElement("ul"); ul.className = "chips";
      nbrs.forEach(function (m) {
        var edge = node.edgesWith(m)[0];
        ul.appendChild(chip(m.data("label"), (edge ? edge.data("label") : "") + (m.hasClass("off") ? " (꺼짐)" : ""), m.id()));
      });
      panel.append(h4, ul);
    }

    var back = document.createElement("button"); back.type = "button"; back.className = "chip";
    back.style.marginTop = "16px"; back.textContent = "전체 개념 보기";
    back.addEventListener("click", reset);
    panel.appendChild(back);
  }

  function reset() {
    cy.elements().removeClass("faded hl");
    cy.elements().unselect();
    selectedId = null;
    cy.animate({ fit: { eles: cy.nodes().not(".off"), padding: 40 }, duration: reduceMotion ? 0 : 300 });
    showAll();
  }

  cy.on("tap", "node", function (e) { show(e.target.id()); });
  cy.on("tap", function (e) { if (e.target === cy) reset(); });

  showAll();
})();
</script>
</body>
</html>
